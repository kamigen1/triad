<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Triad Summons</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#032b19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triad Summons">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
<style>
/* Layout: a one-screen phone game. Hex player badge and currency pills on top, the current tab in the middle, a five-button bar with a raised diamond PLAY at the bottom; matches, sheets and the splash lay over it.
   Look: a casino at night. Felt green, gold-yellow, signal red and near-black, chunky outlined type, bevelled buttons with a hard bottom edge, ribbon banners. One committed dark theme. */
:root {
  --felt: #12834f; --felt-d: #07562f; --felt-dd: #032b19; --black: #070a08; --panel: #0c2218; --panel-hi: #134230; --edge: #1f8a58;
  --yellow: #ffd23f; --yellow-d: #c98a0c; --red: #ec3d4c; --red-d: #8f1624; --ink: #ffffff; --muted: #9fd0b4; --ok: #6df09a;
  --lv1: #b09274; --lv2: #d0d8de; --lv3: #46e0c4; --lv4: #c58bff; --lv5: #ffd23f;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif; --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { background: #032b19; }
.sa html, .sa body { height: var(--app-h, 100%); }
.sa #app { padding-top: env(safe-area-inset-top, 0px); height: var(--app-h, 100%); }
.sa #splash { padding-top: env(safe-area-inset-top, 0px); bottom: auto; height: var(--app-h, 100%); }
.sa #match { bottom: auto; height: var(--app-h, 100%); }
.sa #modal { bottom: auto; height: var(--app-h, 100%); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; color: var(--ink); font: 800 15px/1.35 var(--body); padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-touch-callout: none;
  background: radial-gradient(ellipse at 50% -10%, #1aa664 0%, var(--felt) 22%, var(--felt-d) 58%, var(--felt-dd) 100%); }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .07; background-size: 120px 120px; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><text x='12' y='40' font-size='34' fill='white'>♠</text><text x='72' y='44' font-size='34' fill='white'>♥</text><text x='16' y='104' font-size='34' fill='white'>♦</text><text x='72' y='108' font-size='34' fill='white'>♣</text></svg>"); }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, #000a 100%); }
button { font: inherit; color: inherit; cursor: pointer; }
.fat { font-family: var(--display); font-weight: 400; letter-spacing: .02em; -webkit-text-stroke: .14em #000; paint-order: stroke fill; text-shadow: 0 .09em 0 #000; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 400; }
#app { height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; position: relative; z-index: 1; }

/* top bar */
#hud { display: flex; align-items: center; gap: 10px; padding: 8px 0 6px; }
.hexw { position: relative; flex: none; }
.hex { position: relative; width: 54px; height: 60px; flex: none; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--yellow); display: grid; place-items: center; }
.hex::before { content: ""; position: absolute; inset: 3px; clip-path: inherit; background: radial-gradient(circle at 40% 30%, #2b2f2d, #080a09); }
.hex span { position: relative; font-size: 26px; color: var(--yellow); line-height: 1; }
.lvbadge { position: absolute; left: -2px; bottom: -3px; background: #000; color: #fff; font: 400 13px var(--display); border: 2px solid var(--yellow); border-radius: 8px; padding: 0 6px; z-index: 2; }
.who { flex: 1; min-width: 0; }
.who b { font: 400 15px var(--display); display: block; letter-spacing: .03em; }
.xp { height: 12px; border: 2px solid #000; border-radius: 7px; background: #031a10; overflow: hidden; position: relative; margin-top: 3px; }
.xp i { display: block; height: 100%; background: linear-gradient(#ffe57a, var(--yellow-d)); }
.xp small { position: absolute; inset: 0; text-align: center; font: 800 9px/10px var(--body); color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; }
.pills { display: flex; gap: 6px; }
.pill { display: flex; align-items: center; gap: 4px; background: linear-gradient(#000d, #0a1a12); clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 50%, calc(100% - 8px) 100%, 0 100%); padding: 3px 16px 3px 6px; font: 400 17px var(--display); font-variant-numeric: tabular-nums; }
.pill svg { width: 22px; height: 22px; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -.15em; }
main { flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; padding: 4px 0 14px; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }

/* bottom bar: a dark bar of diamond icons; the selected one rises into a notched tab and shows its name */
nav { display: grid; grid-template-columns: repeat(6, 1fr); align-items: end; padding: 0 0 max(0px, env(safe-area-inset-bottom, 0px)); background: linear-gradient(#0c2217, #040a07); border-top: 3px solid #000; box-shadow: 0 -3px 0 var(--edge); min-height: 62px; margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
nav button { background: none; border: 0; padding: 7px 0 6px; color: var(--yellow); font: 400 12px var(--display); letter-spacing: .05em; position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; height: 62px; justify-content: center; }
nav .dia { width: 40px; height: 40px; transform: rotate(45deg); border-radius: 9px; background: linear-gradient(135deg, #1f4636, #0a1812); border: 3px solid #000; box-shadow: inset 0 0 0 2px #2d7352; display: grid; place-items: center; }
nav .dia svg { transform: rotate(-45deg); width: 24px; height: 24px; opacity: .8; }
nav .lb { display: none; margin-top: 1px; text-shadow: 0 2px 0 #000; -webkit-text-stroke: .1em #000; paint-order: stroke fill; color: #fff; }
nav button.on { height: 76px; margin-top: -14px; padding-top: 10px; background: linear-gradient(#1d5039, #0d2a1d); clip-path: polygon(0 12px, 12px 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); box-shadow: inset 0 3px 0 var(--yellow); }
nav button.on .dia { width: 44px; height: 44px; background: linear-gradient(135deg, #ff6372, var(--red) 55%, var(--red-d)); box-shadow: inset 0 0 0 3px var(--yellow), 0 0 14px #ffd23f88; }
nav button.on .dia svg { opacity: 1; width: 28px; height: 28px; }
nav button.on .lb { display: block; }
nav .dot { position: absolute; top: 8px; right: 22%; width: 13px; height: 13px; border-radius: 50%; background: var(--red); border: 2px solid #000; }

/* buttons, panels, ribbons */
.btn { font: 400 17px var(--display); letter-spacing: .03em; color: #fff; background: linear-gradient(#2f9e68, #146c42); border: 3px solid #000; border-radius: 14px; padding: 9px 16px; box-shadow: inset 0 2px 0 #ffffff55, 0 5px 0 #000; -webkit-text-stroke: .1em #000; paint-order: stroke fill; text-shadow: 0 2px 0 #000; transition: transform .06s, box-shadow .06s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 2px 0 #ffffff55, 0 1px 0 #000; }
.btn.yellow { background: linear-gradient(#fff08a, var(--yellow) 45%, var(--yellow-d)); color: #fff; }
.btn.red { background: linear-gradient(#ff7886, var(--red) 50%, var(--red-d)); }
.btn.dark { background: linear-gradient(#34413a, #151d19); }
.btn.big { font-size: 24px; padding: 13px 26px; border-radius: 18px; }
.btn.sm { font-size: 14px; padding: 6px 12px; border-radius: 11px; box-shadow: inset 0 2px 0 #ffffff55, 0 3px 0 #000; }
.btn:disabled { filter: grayscale(1) brightness(.6); cursor: default; }
.panel { background: linear-gradient(#0f2e21, var(--panel)); border: 3px solid #000; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--edge), 0 4px 0 #000a; padding: 12px; }
.ribbon { display: block; margin: 14px auto 10px; width: max-content; max-width: 100%; padding: 5px 34px 6px; font: 400 20px var(--display); letter-spacing: .04em; color: #fff; -webkit-text-stroke: .1em #000; paint-order: stroke fill; text-shadow: 0 2px 0 #000; background: linear-gradient(#ff6372, var(--red) 55%, var(--red-d)); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%, 14px 50%); text-align: center; filter: drop-shadow(0 3px 0 #000); }
.ribbon.gold { background: linear-gradient(#fff08a, var(--yellow) 50%, var(--yellow-d)); }
.ribbon.green { background: linear-gradient(#3fcb83, var(--felt) 55%, var(--felt-d)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.c { justify-content: center; }
.note { color: var(--muted); font-size: 13px; font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; }
.item .t { flex: 1; min-width: 0; }
.item .t b { display: block; font: 400 17px var(--display); letter-spacing: .02em; }
.item .t small { color: var(--muted); font-weight: 700; }
.tag { font: 400 12px var(--display); padding: 2px 9px; border-radius: 9px; background: #000a; border: 2px solid #000; color: var(--muted); white-space: nowrap; }
.tag.ok { color: var(--ok); } .tag.gold { color: var(--yellow); }
select, input[type=text], input[type=search], textarea { background: #05150d; color: #fff; border: 3px solid #000; box-shadow: inset 0 0 0 2px var(--edge); border-radius: 12px; padding: 9px 10px; font: 800 15px var(--body); min-width: 0; user-select: text; -webkit-user-select: text; }
textarea { width: 100%; resize: none; font: 700 11px/1.3 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; }
.bar { height: 14px; border: 2px solid #000; border-radius: 8px; background: #031a10; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(#ffe57a, var(--yellow-d)); }

/* play tab: the hero scene, the next-stage badge, the PLAY button */
.hero { position: relative; height: 388px; margin: 0 -14px; overflow: hidden; }
.hero::before { content: ""; position: absolute; left: 50%; top: -20px; width: 300px; height: 380px; transform: translateX(-50%); background: linear-gradient(#fff6c8cc, #ffe27a33 60%, transparent); clip-path: polygon(34% 0, 66% 0, 100% 100%, 0 100%); filter: blur(3px); }
.fan { position: absolute; left: 50%; bottom: 74px; width: 0; height: 0; }
.fan .card { position: absolute; width: 92px; left: -46px; bottom: 0; transform-origin: 50% 130%; animation: float 3.4s ease-in-out infinite; }
.fan .card:nth-child(1) { transform: rotate(-16deg) translateX(-34px); animation-delay: -.4s; }
.fan .card:nth-child(2) { transform: rotate(0deg) translateY(-14px); z-index: 2; animation-delay: -1.4s; }
.fan .card:nth-child(3) { transform: rotate(16deg) translateX(34px); animation-delay: -2.4s; }
@keyframes float { 50% { margin-bottom: 8px; } }
.badge { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 168px; padding: 22px 0 16px; text-align: center; background: linear-gradient(#143c2b, #072316); clip-path: polygon(50% 0, 100% 14%, 100% 86%, 50% 100%, 0 86%, 0 14%); }
.badge::before { content: ""; position: absolute; inset: 4px; clip-path: inherit; background: linear-gradient(#18523a, #0a2a1c); }
.badge::after { content: ""; position: absolute; inset: 0; clip-path: inherit; box-shadow: inset 0 0 0 3px var(--yellow); pointer-events: none; }
.badge > * { position: relative; z-index: 1; display: block; }
.badge small { font: 400 12px var(--display); color: var(--muted); letter-spacing: .06em; }
.badge b { font: 400 17px/1.05 var(--display); padding: 2px 12px; }
.badge i { font: 400 38px/1 var(--display); font-style: normal; color: var(--yellow); }
.playwrap { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: center; }
.nodes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
.node { position: relative; aspect-ratio: 1; border: 0; padding: 0; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: var(--yellow); }
.node::before { content: ""; position: absolute; inset: 3px; clip-path: inherit; background: linear-gradient(#164a34, #0a2a1c); }
.node.done::before { background: linear-gradient(#2fbf74, #137042); }
.node.lock { background: #2a3a32; } .node.lock::before { background: #101a15; }
.node.next { background: #fff; animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 8px #ffd23f); } }
.node span { position: relative; font: 400 24px var(--display); -webkit-text-stroke: .1em #000; paint-order: stroke fill; }
.node small { position: absolute; bottom: 12%; z-index: 1; font: 400 10px var(--display); color: var(--yellow); }
.node.lock span { color: #6b8274; }
.node.boss span { color: var(--red); }

/* cards: a trading-card frame in the rarity's colour. Common white, uncommon green, rare blue, epic purple, legendary orange, secret rare red (summon-only). Foil gets stronger up the tiers. */
:root { --r1: #f4f4f4; --r1d: #8f949a; --r2: #52e57a; --r2d: #187a36; --r3: #4fadff; --r3d: #1650a6; --r4: #bc8aff; --r4d: #582bb8; --r5: #ffa933; --r5d: #b04c00; --r6: #ff3f50; --r6d: #70040f; }
.card { position: relative; aspect-ratio: 5 / 7; container-type: inline-size; border-radius: 6.5% / 4.65%; overflow: hidden; user-select: none; background: linear-gradient(135deg, var(--c) 0%, var(--cd) 26%, var(--c) 48%, var(--cd) 72%, var(--c) 100%); box-shadow: 0 0 0 2px #000, 0 3px 0 2px #000a, 0 0 var(--glow, 0) var(--c); }
.card.r1 { --c: var(--r1); --cd: var(--r1d); --ho: 0; --glow: 0; } .card.r2 { --c: var(--r2); --cd: var(--r2d); --ho: .12; --glow: 4px; }
.card.r3 { --c: var(--r3); --cd: var(--r3d); --ho: .3; --glow: 7px; } .card.r4 { --c: var(--r4); --cd: var(--r4d); --ho: .5; --glow: 10px; }
.card.r5 { --c: var(--r5); --cd: var(--r5d); --ho: .7; --glow: 14px; } .card.r6 { --c: var(--r6); --cd: var(--r6d); --ho: .95; --glow: 18px; }
.card .win { position: absolute; left: 3.6cqw; right: 3.6cqw; top: 3.6cqw; bottom: 17cqw; border-radius: 3cqw; overflow: hidden; background: #000; box-shadow: inset 0 0 0 .8cqw #000, 0 0 0 .6cqw #0009; }
.card .win::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 5cqw #000c; pointer-events: none; }
.card .art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; object-fit: cover; }
.card .holo { position: absolute; inset: 0; pointer-events: none; opacity: var(--ho, 0); mix-blend-mode: color-dodge; background: linear-gradient(115deg, transparent 18%, #ff2d95aa 30%, #ffe600aa 38%, #00ffc3aa 46%, #1f8bffaa 54%, #b300ffaa 62%, transparent 76%); background-size: 320% 320%; background-position: var(--mx, 20%) var(--my, 20%); animation: holo 6s ease-in-out infinite; }
.card.tilt .holo { animation: none; }
@keyframes holo { 0% { background-position: 0% 0%; } 50% { background-position: 100% 100%; } 100% { background-position: 0% 0%; } }
.card.r3 .win::before, .card.r4 .win::before, .card.r5 .win::before, .card.r6 .win::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; mix-blend-mode: screen; opacity: .8; animation: twinkle 2.6s steps(1) infinite; background-image: radial-gradient(circle, #fff 0 .5cqw, transparent .7cqw), radial-gradient(circle, #fff 0 .4cqw, transparent .6cqw), radial-gradient(circle, #fff 0 .6cqw, transparent .8cqw); background-size: 31cqw 27cqw, 23cqw 37cqw, 41cqw 33cqw; background-position: 4cqw 7cqw, 13cqw 19cqw, 26cqw 3cqw; }
@keyframes twinkle { 50% { opacity: .15; } }
.card.r6 .holo::after { content: ""; position: absolute; inset: 0; mix-blend-mode: overlay; background: repeating-conic-gradient(from 20deg at 50% 42%, #ffffff55 0 5deg, transparent 5deg 10deg); }
.card.r6::before, .card.r5::before { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; background: linear-gradient(105deg, transparent 38%, #ffffff66 49%, transparent 60%); background-size: 280% 100%; animation: sheen 3.4s linear infinite; mix-blend-mode: overlay; }
@keyframes sheen { from { background-position: 160% 0; } to { background-position: -110% 0; } }
.card .gems { position: absolute; left: 6.5cqw; top: 6.5cqw; display: flex; flex-direction: column; gap: 1.2cqw; z-index: 3; }
.card .gems i { width: 4.2cqw; height: 4.2cqw; transform: rotate(45deg); background: linear-gradient(135deg, #fff, var(--c) 60%, var(--cd)); border: .6cqw solid #000; box-shadow: 0 0 1.6cqw var(--c); }
.card .cnt { position: absolute; top: 5cqw; right: 6cqw; z-index: 4; background: #000d; color: var(--r5); border-radius: 999px; font: 400 9cqw var(--display); padding: .5cqw 3cqw; }
.card .cost { position: absolute; right: 6.4cqw; bottom: 21cqw; z-index: 4; width: 13cqw; height: 13cqw; display: grid; place-items: center; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(#ffe57a, #c98a0c); font: 400 9cqw/1 var(--display); color: #2a1a00; }
.card .n { position: absolute; z-index: 3; width: 16cqw; height: 16cqw; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 35% 28%, #3a424a, #090c0f 75%); border: 1cqw solid var(--c); box-shadow: 0 0 0 .6cqw #000, 0 .8cqw 1.4cqw #000a; font: 400 11.5cqw/1 var(--display); color: #fff; text-shadow: 0 .7cqw 0 #000; }
.card .n.t { top: 6cqw; left: 50%; transform: translateX(-50%); } .card .n.b { bottom: 21cqw; left: 50%; transform: translateX(-50%); }
.card .n.r { right: 6.6cqw; top: 50cqw; } .card .n.l { left: 6.6cqw; top: 50cqw; }
.card .plate { position: absolute; left: 3.6cqw; right: 3.6cqw; bottom: 3.6cqw; height: 12.4cqw; z-index: 3; background: linear-gradient(#141a20, #04070a); border: .7cqw solid #000; border-radius: 2.6cqw; box-shadow: inset 0 .7cqw 0 var(--c); display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 0 2cqw; }
.card .plate .nm { font: 400 8.2cqw/1.05 var(--display); color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .02em; }
.card .plate .sub { font: 400 4.2cqw/1.3 var(--display); color: var(--c); letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
@container (max-width: 112px) {
  .card .plate .sub { display: none; } .card .plate { height: 10.5cqw; } .card .plate .nm { font-size: 9.6cqw; }
  .card .win { bottom: 15cqw; } .card .n { width: 21cqw; height: 21cqw; font-size: 15.5cqw; } .card .n.t { top: 3cqw; } .card .n.b { bottom: 17cqw; } .card .n.r { right: 3.4cqw; top: 45cqw; } .card .n.l { left: 3.4cqw; top: 45cqw; }
  .card .gems { left: 5cqw; top: 25cqw; } .card .gems i { width: 5cqw; height: 5cqw; }
}
.card .tint { position: absolute; inset: 0; z-index: 5; background: transparent; transition: background .25s; border-radius: inherit; pointer-events: none; }
.card.me .tint { background: #ffd23f40; box-shadow: inset 0 0 0 2.6cqw #ffd23f; } .card.foe .tint { background: #ec3d4c4d; box-shadow: inset 0 0 0 2.6cqw #ec3d4c; }
.card.miss { filter: grayscale(1) brightness(.32); }
.card.sel { transform: translateY(-12px) scale(1.04); z-index: 6; box-shadow: 0 0 0 2px #000, 0 0 0 5px var(--yellow), 0 0 16px var(--yellow); }
.card.pop { animation: pop .35s ease-out; }
@keyframes pop { 0% { transform: scale(1.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.card.flip { animation: flipc .5s ease-in-out; }
@keyframes flipc { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); } 100% { transform: rotateY(0); } }
.card.tilt { transition: transform .12s ease-out; will-change: transform; }
.rtag { display: inline-block; font: 400 12px var(--display); letter-spacing: .08em; padding: 1px 9px; border-radius: 8px; border: 2px solid #000; color: #fff; background: linear-gradient(var(--c), var(--cd)); -webkit-text-stroke: .08em #000; paint-order: stroke fill; }
.rtag.r1 { --c: var(--r1); --cd: var(--r1d); } .rtag.r2 { --c: var(--r2); --cd: var(--r2d); } .rtag.r3 { --c: var(--r3); --cd: var(--r3d); } .rtag.r4 { --c: var(--r4); --cd: var(--r4d); } .rtag.r5 { --c: var(--r5); --cd: var(--r5d); } .rtag.r6 { --c: var(--r6); --cd: var(--r6d); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 9px; }
.grid .card { width: 100%; }

/* match */
#match { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 38%, #1aa664 0%, var(--felt) 30%, var(--felt-d) 70%, var(--felt-dd) 100%); }
#match::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(#ffffff30, transparent 40%); clip-path: polygon(30% 0, 70% 0, 100% 60%, 0 60%); opacity: .5; }
#match .inner { width: 100%; max-width: 480px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; position: relative; }
.mtop { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.mtop > :last-child { justify-self: end; }
.score { display: flex; gap: 6px; align-items: stretch; }
.score .a, .score .b { min-width: 62px; text-align: center; font: 400 28px/1 var(--display); padding: 3px 10px 5px; border: 3px solid #000; border-radius: 12px; -webkit-text-stroke: .1em #000; paint-order: stroke fill; text-shadow: 0 2px 0 #000; box-shadow: 0 3px 0 #000; }
.score .a { background: linear-gradient(#fff08a, var(--yellow-d)); } .score .b { background: linear-gradient(#ff7886, var(--red-d)); }
.score small { display: block; font: 400 9px var(--display); letter-spacing: .06em; -webkit-text-stroke: 0; text-shadow: none; color: #000a; }
.turn { text-align: center; min-height: 28px; font: 400 20px var(--display); letter-spacing: .06em; color: var(--yellow); -webkit-text-stroke: .12em #000; paint-order: stroke fill; text-shadow: 0 2px 0 #000; }
.turn.foe { color: #ff8d98; }
.tray { background: linear-gradient(#10261b, #07140d); border: 3px solid #000; border-radius: 16px; box-shadow: inset 0 0 0 2px var(--edge), 0 4px 0 #000a; padding: 8px 8px 6px; }
.hand { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
.hand .card { width: 100%; }
.hand.mine .card { cursor: pointer; transition: transform .12s; }
#board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; width: min(100%, calc((100dvh - 340px) / 1.55)); margin: 0 auto; padding: 9px; background: #00000040; border: 3px solid #000; border-radius: 16px; box-shadow: inset 0 0 0 2px #ffd23f66, 0 4px 0 #000a; }
#board.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translate(-5px, 2px); } 40% { transform: translate(5px, -2px); } 60% { transform: translate(-3px, -3px); } 80% { transform: translate(3px, 2px); } }
.cell { aspect-ratio: 5 / 7; border-radius: 10px; background: #0000004d; border: 2px dashed #ffffff40; position: relative; }
.cell.hint { background: #ffd23f33; border: 3px solid var(--yellow); box-shadow: 0 0 14px #ffd23f99; animation: glow 1.2s ease-in-out infinite; }
.cell.hint2 { background: #ffd23f77; box-shadow: 0 0 22px #ffd23f; }
.cell .card { position: absolute; inset: 0; width: 100%; height: 100%; }
.word { position: absolute; left: 50%; top: 38%; transform: translate(-50%, 0); font: 400 26px var(--display); color: #fff; -webkit-text-stroke: .14em #000; paint-order: stroke fill; text-shadow: 0 3px 0 #000; pointer-events: none; animation: rise 1s ease-out forwards; z-index: 3; white-space: nowrap; }
.word.s { color: #ffe066; } .word.p { color: #7be0ff; } .word.c { color: #ff9ad5; } .word.ouch { color: #ff7b86; } .word.cap { color: #9dffae; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.5); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -30px) scale(1); } }

/* sheets, splash, toast */
#modal { position: fixed; inset: 0; z-index: 40; background: #000c; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; background: linear-gradient(#103325, #07170f); border: 3px solid #000; border-bottom: 0; border-radius: 22px 22px 0 0; box-shadow: inset 0 0 0 3px var(--yellow); padding: 18px max(18px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet h2 { text-align: center; margin-bottom: 8px; }
.over { position: absolute; inset: 0; background: #000b; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.over .sheet { border-radius: 22px; border-bottom: 3px solid #000; max-width: 440px; }
.rw { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
.rwi { position: relative; width: 62px; height: 62px; display: grid; place-items: center; border: 3px solid #000; border-radius: 8px; box-shadow: 0 3px 0 #000a; }
.rwi svg { width: 38px; height: 38px; }
.rwi b { position: absolute; right: 4px; bottom: 0; font: 400 14px var(--display); color: #fff; -webkit-text-stroke: .14em #000; paint-order: stroke fill; }
.rwi.p { background: linear-gradient(#a56bff, #5a2bb0); box-shadow: inset 0 0 0 2px #d9bcff, 0 3px 0 #000a; }
.rwi.b { background: linear-gradient(#5cc8ff, #1f6fb5); box-shadow: inset 0 0 0 2px #bfe8ff, 0 3px 0 #000a; }
.rwi.g { background: linear-gradient(#ffe57a, var(--yellow-d)); box-shadow: inset 0 0 0 2px #fff3b0, 0 3px 0 #000a; }
.hexgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 14px; }
.hx { position: relative; aspect-ratio: 0.9; clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%); background: #c7ced4; display: grid; place-items: center; }
.hx::before { content: ""; position: absolute; inset: 4px; clip-path: inherit; background: linear-gradient(#8e979e, #6d767d); }
.hx.q span { position: relative; font: 400 40px var(--display); color: #c7ced4; opacity: .8; }
.hx.f { background: var(--c); } .hx.f::before { background: #08150f; }
.hx.f img { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%); object-fit: cover; image-rendering: pixelated; }
.hx.f small { position: absolute; bottom: 14%; left: 0; right: 0; text-align: center; font: 400 11px var(--display); color: #fff; -webkit-text-stroke: .16em #000; paint-order: stroke fill; }
.hx.r1 { --c: var(--r1); } .hx.r2 { --c: var(--r2); } .hx.r3 { --c: var(--r3); } .hx.r4 { --c: var(--r4); } .hx.r5 { --c: var(--r5); } .hx.r6 { --c: var(--r6); }
.bighex { position: relative; width: 240px; height: 270px; margin: 20px auto; clip-path: polygon(50% 0, 100% 24%, 100% 76%, 50% 100%, 0 76%, 0 24%); background: #c7ced4; display: grid; place-items: center; animation: shk .5s ease-in-out infinite; }
.bighex::before { content: ""; position: absolute; inset: 7px; clip-path: inherit; background: linear-gradient(#aeb7be, #7d868d); }
.bighex span { position: relative; font: 400 120px var(--display); color: #e4e9ec; opacity: .85; }
@keyframes shk { 25% { transform: rotate(-2deg); } 75% { transform: rotate(2deg); } }
.stagehint { text-align: center; font: 400 22px var(--display); color: #b8c8ff; -webkit-text-stroke: .1em #000; paint-order: stroke fill; animation: glow 1.2s ease-in-out infinite; }
#toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -20px); background: linear-gradient(#fff, #cfe9ff); color: #123; border: 3px solid #000; box-shadow: 0 4px 0 #000; padding: 8px 18px; border-radius: 999px; z-index: 80; pointer-events: none; opacity: 0; transition: opacity .25s, transform .25s; max-width: 92%; text-align: center; font: 400 15px var(--display); }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
#splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(ellipse at 50% 30%, #1aa664, var(--felt-d) 55%, var(--felt-dd)); transition: opacity .5s; }
#splash.gone { opacity: 0; pointer-events: none; }
#splash .logo { font-size: 66px; line-height: .9; color: #fff; text-align: center; transform: rotate(-3deg); }
#splash .logo i { display: block; font-style: normal; color: var(--yellow); font-size: 50px; }
#splash small { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); font: 400 18px var(--display); color: #fff; -webkit-text-stroke: .12em #000; paint-order: stroke fill; }

/* summon */
.mach { position: relative; margin: 6px auto 0; width: min(100%, 360px); padding: 22px 14px 18px; border-radius: 26px; background: linear-gradient(#1b1f1d, #060807); border: 4px solid #000; box-shadow: inset 0 0 0 3px var(--yellow), 0 6px 0 #000a; text-align: center; }
.bulbs { position: absolute; inset: 7px; border-radius: 20px; pointer-events: none; border: 5px dotted var(--yellow); opacity: .9; animation: bulbs 1s steps(1) infinite; }
@keyframes bulbs { 50% { border-color: var(--red); } }
.orb { position: relative; width: 168px; height: 168px; margin: 8px auto 14px; border-radius: 50%; background: radial-gradient(circle at 35% 28%, #fff7c2, var(--yellow) 30%, var(--red) 66%, #2a0509); border: 5px solid #000; box-shadow: 0 0 36px #ffd23faa, 0 0 80px #ec3d4c66, inset 0 -10px 20px #0006; animation: orb 2.6s ease-in-out infinite; display: grid; place-items: center; }
.orb::after { content: ""; position: absolute; width: 56px; height: 28px; left: 24px; top: 20px; border-radius: 50%; background: #fff9; transform: rotate(-30deg); filter: blur(2px); }
.orb b { font: 400 28px var(--display); color: #fff; -webkit-text-stroke: .14em #000; paint-order: stroke fill; text-shadow: 0 3px 0 #000; position: relative; z-index: 1; }
@keyframes orb { 50% { transform: scale(1.05); box-shadow: 0 0 56px #ffd23f, 0 0 110px #ec3d4c99, inset 0 -10px 20px #0006; } }
.pity { text-align: left; margin: 12px 0 4px; }
.pity small { display: flex; justify-content: space-between; font: 400 12px var(--display); color: var(--muted); margin-bottom: 3px; }
.reveal { display: grid; gap: 9px; }
.reveal .card { opacity: 0; width: 100%; }
.reveal .card.in { animation: pop .45s ease-out forwards; }
.reveal .wrap { position: relative; }
.reveal .tg { position: absolute; left: 0; right: 0; bottom: -4px; text-align: center; font: 400 12px var(--display); color: var(--ok); -webkit-text-stroke: .14em #000; paint-order: stroke fill; z-index: 3; }
.reveal .tg.d { color: #ffb0b8; }
table.odds { width: 100%; border-collapse: collapse; } table.odds td { padding: 5px 0; border-bottom: 2px solid #ffffff22; } table.odds td:last-child { text-align: right; font-family: var(--display); font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; margin: 8px 0; }
.slots .card, .slots .empty { width: 100%; aspect-ratio: 5 / 7; }
.slots .empty { border: 3px dashed #ffffff44; border-radius: 10px; background: #0003; }
.filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 9px; }
.filters select, .filters input { flex: 1 1 100px; }
.mute { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 3px solid #000; background: linear-gradient(#34413a, #151d19); box-shadow: inset 0 2px 0 #ffffff44, 0 3px 0 #000; font-size: 16px; line-height: 1; padding: 0; }
.rng { flex: 1; min-width: 0; accent-color: var(--yellow); height: 28px; }
/* ----- quest: team strip + battle ----- */
.team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.team .slot { text-align: center; cursor: pointer; } .team .slot small { display: block; margin-top: 4px; font: 400 12px var(--display); color: var(--yellow); }
.team .slot.empty { aspect-ratio: 5 / 7; display: grid; place-items: center; border: 3px dashed #ffffff40; border-radius: 10px; font: 400 30px var(--display); color: #ffffff60; }
.grid.pick .pk { text-align: center; } .grid.pick .pk small { display: block; margin-top: 3px; font: 700 10px/1.2 var(--body); color: var(--muted); }
.grid.pick .card.sel { transform: none; box-shadow: 0 0 0 2px #000, 0 0 0 5px var(--yellow), 0 0 14px var(--yellow); }
#bt { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(12px, env(safe-area-inset-left, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 30%, #1d8a5b 0%, var(--felt-d) 55%, var(--felt-dd) 100%); }
.sa #bt { bottom: auto; height: var(--app-h, 100%); }
#bt[hidden] { display: none; }
#bt.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flashw .6s ease-out forwards; pointer-events: none; z-index: 9; }
@keyframes flashw { 0% { opacity: .9; } 100% { opacity: 0; } }
#bt .inner { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; min-height: 0; gap: 8px; }
.btop { display: flex; align-items: center; gap: 8px; } .bwave { flex: 1; text-align: center; font: 400 18px var(--display); color: var(--yellow); -webkit-text-stroke: .12em #000; paint-order: stroke fill; }
#bauto.on { background: linear-gradient(#fff08a, var(--yellow-d)); }
.bfield { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; }
.brow { display: flex; justify-content: center; gap: 8px; align-items: flex-end; }
.bmsg { text-align: center; min-height: 26px; font: 400 18px var(--display); color: #fff; -webkit-text-stroke: .12em #000; paint-order: stroke fill; opacity: 0; }
.bmsg.in { animation: msg 1.1s ease-out; } @keyframes msg { 0% { opacity: 0; transform: scale(.7); } 15% { opacity: 1; transform: scale(1.1); } 80% { opacity: 1; } 100% { opacity: 0; } }
.ut { position: relative; width: min(23vw, 112px); text-align: center; transition: transform .15s, opacity .4s, filter .4s; --c: var(--r1); --cd: var(--r1d); }
.ut.r2 { --c: var(--r2); --cd: var(--r2d); } .ut.r3 { --c: var(--r3); --cd: var(--r3d); } .ut.r4 { --c: var(--r4); --cd: var(--r4d); } .ut.r5 { --c: var(--r5); --cd: var(--r5d); } .ut.r6 { --c: var(--r6); --cd: var(--r6d); }
.ut .uart { aspect-ratio: 5 / 6; border-radius: 12px; overflow: hidden; border: 3px solid #000; background: #000; box-shadow: 0 0 0 3px var(--c), 0 4px 0 3px #000a; }
.ut.foe .uart { box-shadow: 0 0 0 3px #ec3d4c, 0 4px 0 3px #000a; }
.ut .uart img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ut .uhp, .ut .ubc { height: 8px; margin-top: 6px; border: 2px solid #000; border-radius: 5px; background: #031a10; overflow: hidden; } .ut .ubc { height: 6px; margin-top: 3px; }
.ut .uhp i { display: block; height: 100%; width: 100%; background: linear-gradient(#7dff9a, #19a84a); transition: width .3s; } .ut.foe .uhp i { background: linear-gradient(#ff8d98, #d72b3c); }
.ut .ubc i { display: block; height: 100%; width: 0; background: linear-gradient(#ffe57a, var(--yellow-d)); transition: width .3s; }
.ut small { display: block; margin-top: 2px; font: 400 11px var(--display); color: #fff; -webkit-text-stroke: .14em #000; paint-order: stroke fill; white-space: nowrap; }
.ut .rdy { display: none; position: absolute; left: 50%; top: -8px; transform: translateX(-50%); background: linear-gradient(#fff08a, var(--yellow-d)); color: #000; font: 400 11px var(--display); padding: 1px 8px; border: 2px solid #000; border-radius: 9px; }
.ut.ready .rdy { display: block; animation: glow 1s ease-in-out infinite; } .ut.ready { cursor: pointer; } .ut.ready .uart { box-shadow: 0 0 0 3px var(--yellow), 0 0 16px var(--yellow); }
.ut.queued .rdy { background: #fff; } .ut.queued .rdy::after { content: " ✓"; }
.ut.buffed .uart { outline: 3px solid #ff9a3a; }
.ut.dead { opacity: 0; filter: grayscale(1); transform: scale(.8); pointer-events: none; }
.ut.boss { width: min(40vw, 190px); }
.ut.lunge { transform: translateY(-16px) scale(1.06); } .ut.lungef { transform: translateY(16px) scale(1.06); }
.ut.hurt .uart { animation: shake .26s; filter: brightness(1.8); } .ut.burst { transform: scale(1.14); z-index: 4; filter: drop-shadow(0 0 14px var(--yellow)); }
.ut .dmg { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); font: 400 24px var(--display); color: #fff; -webkit-text-stroke: .14em #000; paint-order: stroke fill; pointer-events: none; animation: rise 0.9s ease-out forwards; z-index: 5; }
.ut .dmg.big { color: #ffd23f; font-size: 32px; } .ut .dmg.heal { color: #7dff9a; }
.lbbtn { position: relative; height: 44px; border: 3px solid #000; border-radius: 14px; background: #031a10; overflow: hidden; font: 400 18px var(--display); color: #fff; -webkit-text-stroke: .12em #000; paint-order: stroke fill; box-shadow: inset 0 0 0 2px var(--edge), 0 4px 0 #000; }
.lbbtn i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(#ffb36b, #e0561c); transition: width .3s; } .lbbtn span { position: relative; }
.lbbtn.ready { animation: glow 1s ease-in-out infinite; border-color: var(--yellow); } .lbbtn.queued span::after { content: " ✓"; }
@media (orientation: landscape) and (max-height: 540px) {
  #bt { padding: max(6px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
  #bt .inner { max-width: none; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 16px; row-gap: 6px; }
  .btop { grid-column: 1 / 3; } .bfield { grid-column: 1 / 3; flex-direction: row; align-items: center; } .bfield .brow { flex: 1; } .bmsg { position: absolute; left: 0; right: 0; top: 46%; z-index: 6; pointer-events: none; }
  .lbbtn { grid-column: 1 / 3; height: 34px; font-size: 15px; }
  .team { max-width: 330px; margin: 6px auto 0; } .team .slot small { font-size: 10px; margin-top: 2px; }
  .ut { width: min(15vw, 104px); } .ut.boss { width: min(24vw, 160px); }
}
/* ----- world map ----- */
.qsta { margin: 8px 0 0; }
.region { margin-top: 12px; border: 3px solid #000; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 55%, #06140d), #07170f 70%); box-shadow: inset 0 0 0 2px var(--rc), 0 4px 0 #000a; }
.region .rh { padding: 8px 12px 4px; } .region .rh b { display: block; font-size: 20px; } .region .rh small { color: var(--muted); font-weight: 700; }
.region .rc { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 10px 10px; }
.chap { text-align: left; background: #000a; border: 2px solid #000; border-radius: 12px; padding: 8px 10px; position: relative; box-shadow: inset 0 0 0 2px #ffffff22; }
.chap small { display: block; font: 400 10px var(--display); color: var(--rc); letter-spacing: .06em; } .chap b { display: block; font: 400 15px/1.1 var(--display); } .chap span { position: absolute; right: 8px; top: 8px; font: 400 14px var(--display); color: var(--yellow); }
.chap.done { box-shadow: inset 0 0 0 2px var(--ok); } .chap.lock { opacity: .55; } .region.lock { opacity: .6; }
.ribbon[style*="--rc"] { background: linear-gradient(color-mix(in srgb, var(--rc) 70%, #fff), var(--rc) 55%, color-mix(in srgb, var(--rc) 55%, #000)); }
.nodes.six { grid-template-columns: repeat(3, 1fr); max-width: 420px; margin-left: auto; margin-right: auto; }
/* ----- effects ----- */
#bfx { position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden; }
.fx { position: absolute; display: block; transform-origin: 50% 50%; pointer-events: none; }
.fx.slash { background: linear-gradient(90deg, transparent, #fff 30%, var(--c) 70%, transparent); border-radius: 4px; box-shadow: 0 0 14px var(--c); }
.fx.claw { background: linear-gradient(#fff, #ff5468); border-radius: 3px; box-shadow: 0 0 8px #ff5468; transform-origin: 50% 0; }
.fx.orb { border-radius: 50%; background: radial-gradient(circle, #fff, var(--c) 60%, transparent 72%); box-shadow: 0 0 18px var(--c); }
.fx.bolt { background: linear-gradient(90deg, #fff, var(--c)); border-radius: 3px; box-shadow: 0 0 12px var(--c); }
.fx.ring { border-radius: 50%; border: 4px solid var(--c); box-shadow: 0 0 12px var(--c), inset 0 0 8px var(--c); }
.fx.spark { border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
#bcut { position: absolute; inset: 0; z-index: 12; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000a; pointer-events: none; }
#bcut[hidden] { display: none; }
#bcut .rays { position: absolute; inset: -50%; background: repeating-conic-gradient(var(--c) 0 6deg, transparent 6deg 14deg); opacity: .45; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#bcut .who2 { position: relative; width: min(46vw, 230px); aspect-ratio: 5 / 6; border: 4px solid #000; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 4px var(--c), 0 0 40px var(--c); animation: cutin .5s cubic-bezier(.2, 1.3, .4, 1); transform: rotate(-4deg); }
#bcut .who2 img { width: 100%; height: 100%; object-fit: cover; }
@keyframes cutin { 0% { transform: translateX(-120%) rotate(-12deg) scale(.8); } 100% { transform: translateX(0) rotate(-4deg) scale(1); } }
#bcut .sk { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 34px; color: #fff; text-shadow: 0 4px 0 #000; animation: skin .45s ease-out; }
#bcut .un { position: absolute; left: 0; right: 0; top: 14%; text-align: center; font-size: 18px; color: var(--yellow); }
@keyframes skin { 0% { transform: translateX(110%); } 100% { transform: translateX(0); } }
.bfield.rock { animation: shake .45s; }
.ut .uart { animation: idle 2.6s ease-in-out infinite; } .ut:nth-child(2n) .uart { animation-delay: -.8s; } .ut:nth-child(3n) .uart { animation-delay: -1.5s; }

const waitIce = pc => new Promise(res => { if (pc.iceGatheringState === "complete") return res(); const t = setTimeout(res, 6000); pc.addEventListener("icegatheringstatechange", () => { if (pc.iceGatheringState === "complete") { clearTimeout(t); res(); } }); });

/* ===== summon ===== */
function pullOne() {

  if (P.pityTop >= 59) pool = Math.random() < .2 ? "ex" : 5;
  else if (P.pityHi >= 9) { const q = Math.random(); pool = q < .05 ? "ex" : q < .3 ? 5 : 4; }
  else pool = r < 1 ? "ex" : r < 5 ? 5 : r < 15 ? 4 : r < 34 ? 3 : r < 62 ? 2 : 1;
  const list = pool === "ex" ? C.filter(c => c.ex) : C.filter(c => !c.ex && c.lv === pool), c = list[Math.floor(Math.random() * list.length)];

}

const hsl2 = (h, s, l) => { h = ((h % 360) + 360) % 360 / 360; s = Math.max(0, Math.min(1, s)); l = Math.max(0, Math.min(1, l)); const f = (p, q, t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < .5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; }; const q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q; return [Math.round(255 * f(p, q, h + 1 / 3)), Math.round(255 * f(p, q, h)), Math.round(255 * f(p, q, h - 1 / 3))]; };

  else if (kind === "orb" && q) { const e = qFxEl("orb", q.x - 14, q.y - 14, 28, 28); e.style.setProperty("--c", col); await qAnim(e, [{ transform: "translate(0,0) scale(.6)" }, { transform: `translate(${p.x - q.x}px,${p.y - q.y}px) scale(1.2)` }], 260); const r = qFxEl("ring", p.x - 10, p.y - 10, 20, 20); r.style.setProperty("--c", col); qAnim(r, [{ transform: "scale(.4)", opacity: 1 }, { transform: "scale(3.2)", opacity: 0 }], 360); e.remove(); }
  else if (kind === "bolt" && q) { const dx = p.x - q.x, dy = p.y - q.y, len = Math.hypot(dx, dy), e = qFxEl("bolt", q.x, q.y - 3, len, 6); e.style.setProperty("--c", col); e.style.transformOrigin = "0 50%"; await qAnim(e, [{ transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(0)`, opacity: 1 }, { transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(1)`, opacity: 1, offset: .5 }, { transform: `rotate(${Math.atan2(dy, dx)}rad) scaleX(1)`, opacity: 0 }], 280); }

/* Used to tune the missions: plays them as a bot (auto battle, no screen). Party: a smooth curve of rising cards at the on-curve level and stars. */
async function qSim(g0, g1, n = 12) {
  qInit(); const out = [], all = C.filter(c => !c.ex).sort((a, b) => qPower(a) - qPower(b));
  for (let g = g0; g <= g1; g++) {
    const stars = 1 + Math.min(4, Math.floor(g / 15)), lv = 1 + Math.round(g * .72), cut = Math.ceil(all.length * (.1 + .75 * g / (NM - 1))), team = all.slice(0, cut).slice(-QTEAM); let w = 0, hp = 0;
    for (let k = 0; k < n; k++) {
      const p = team.map(c => qMk(c, 0, Math.min(lv, qLvCap(c, stars)), stars)); B = { g, ui: false, party: p, wave: 0, foes: qFoes(g, 0), turn: 0, phase: "select", cmds: {}, cur: 0, tgt: null, tgtMode: null, auto: true, speed: 1, last: null, done: false, go: null };
      const r = await qRun(); B = null; if (r === true) { w++; hp += p.reduce((a, u) => a + u.hp, 0) / p.reduce((a, u) => a + u.max, 0); }
    }
    out.push(g + ":" + Math.round(100 * w / n) + "%/" + (w ? Math.round(100 * hp / w) : 0));
  }
  return out.join(" ");
}
